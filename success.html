<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - EagleEye</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .success-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        h1 {
            color: #10b981;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .message {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .details {
            background: #f9fafb;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }

        .details h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2em;
            }

            .success-icon {
                font-size: 4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="success-icon">✅</div>
            <h1>Payment Successful!</h1>
            <p class="message">
                Thank you for subscribing to EagleEye!<br>
                Your account is being activated...
            </p>

            <div class="loading active">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #666;">Setting up your account...</p>
            </div>

            <div id="detailsSection" style="display: none;">
                <div class="details">
                    <h3>📋 Subscription Details</h3>
                    <div class="detail-row">
                        <span class="detail-label">Plan:</span>
                        <span class="detail-value" id="planName">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Tests per month:</span>
                        <span class="detail-value" id="testsLimit">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email:</span>
                        <span class="detail-value" id="userEmail">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status:</span>
                        <span class="detail-value" style="color: #10b981;">Active ✓</span>
                    </div>
                </div>

                <p style="color: #666; margin-bottom: 20px;">
                    Redirecting to dashboard in <span id="countdown">5</span> seconds...
                </p>

                <a href="dashboard.html" class="btn">Go to Dashboard Now →</a>
            </div>

            <div class="error" id="errorMessage"></div>
        </div>
    </div>

    <script>
        // Get user data from localStorage
        const userData = JSON.parse(localStorage.getItem('eagleeye_user') || '{}');
        
        // Get selected plan from sessionStorage
        const selectedPlan = JSON.parse(sessionStorage.getItem('selected_plan') || '{}');

        console.log('User Data:', userData);
        console.log('Selected Plan:', selectedPlan);

        async function processPayment() {
            // Check user logged in
            if (!userData.email) {
                showError('User not logged in. Please login and try again.');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            // Check plan selected
            if (!selectedPlan.plan) {
                showError('No plan selected. Redirecting to pricing...');
                setTimeout(() => {
                    window.location.href = 'pricing.html';
                }, 2000);
                return;
            }

            try {
                // Get plan details
                const planDetails = getPlanDetails(selectedPlan.plan, selectedPlan.price);
                
                console.log('Sending to webhook:', {
                    action: 'update_subscription',
                    email: userData.email,
                    plan_type: planDetails.plan,
                    tests_limit: planDetails.limit
                });

                // Send update to webhook
                const response = await fetch('/.netlify/functions/test-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'update_subscription',
                        email: userData.email,
                        plan_type: planDetails.plan,
                        tests_limit: planDetails.limit,
                        tests_used: 0,
                        subscription_status: 'active',
                        payment_date: new Date().toISOString()
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    // Update localStorage with new plan
                    userData.plan_type = planDetails.plan;
                    userData.tests_limit = planDetails.limit;
                    userData.tests_used = 0;
                    userData.subscription_status = 'active';
                    localStorage.setItem('eagleeye_user', JSON.stringify(userData));

                    // Show success details
                    showSuccessDetails(planDetails);

                    // Clear selected plan
                    sessionStorage.removeItem('selected_plan');
                    
                    // Countdown redirect
                    let seconds = 5;
                    const countdownEl = document.getElementById('countdown');
                    const countdownInterval = setInterval(() => {
                        seconds--;
                        if (countdownEl) countdownEl.textContent = seconds;
                        if (seconds <= 0) {
                            clearInterval(countdownInterval);
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    showError('Failed to activate subscription: ' + (data.message || 'Unknown error'));
                }

            } catch (error) {
                console.error('Error:', error);
                showError('An error occurred: ' + error.message + '. Please contact support.');
            }
        }

        function getPlanDetails(planName, price) {
            const plans = {
                'starter': { plan: 'starter', limit: 10, name: 'Starter' },
                'professional': { plan: 'professional', limit: 25, name: 'Professional' },
                'business': { plan: 'business', limit: 60, name: 'Business' },
                'enterprise': { plan: 'enterprise', limit: 999999, name: 'Enterprise' }
            };

            if (planName && plans[planName.toLowerCase()]) {
                return plans[planName.toLowerCase()];
            }

            // Fallback from price
            if (price === 19) return plans.starter;
            if (price === 49) return plans.professional;
            if (price === 99) return plans.business;

            return plans.starter;
        }

        function showSuccessDetails(planDetails) {
            document.querySelector('.loading').classList.remove('active');
            document.getElementById('detailsSection').style.display = 'block';

            document.getElementById('planName').textContent = planDetails.name;
            document.getElementById('testsLimit').textContent = planDetails.limit === 999999 ? 'Unlimited' : planDetails.limit;
            document.getElementById('userEmail').textContent = userData.email;
        }

        function showError(message) {
            document.querySelector('.loading').classList.remove('active');
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').classList.add('active');
        }

        // Run on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                processPayment();
            }, 1000);
        });
    </script>
</body>
</html>
