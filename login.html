<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EagleEye</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #ef4444;
        }

        .form-group input.success {
            border-color: #10b981;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signup-link {
            text-align: center;
            color: #666;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.95em;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .btn-text { display: none; }
        .btn.loading .spinner { display: block; }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🦅</div>
            <h1>Welcome Back!</h1>
            <p>Login to continue testing your website</p>
        </div>

        <div class="alert alert-error" id="errorAlert">
            ❌ Invalid email or password
        </div>

        <div class="alert alert-success" id="successAlert">
            ✅ Login successful! Redirecting...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    required
                    autocomplete="email"
                >
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password">🔒 Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                >
                <div class="error-message" id="passwordError">Password is required</div>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password" onclick="alert('Feature coming soon!'); return false;">Forgot password?</a>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span class="btn-text">Login</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up for free</a>
        </div>

        <div class="back-link">
            <a href="landing.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        // n8n Webhook URL
        const WEBHOOK_URL = '/.netlify/functions/auth-proxy';

        // Check if user is already logged in
        const savedUser = localStorage.getItem('eagleeye_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            if (userData.logged_in) {
                // Already logged in, redirect to dashboard
                window.location.href = 'dashboard-update.html';
            }
        }

        // Load remembered email if exists
        const rememberedEmail = localStorage.getItem('eagleeye_remembered_email');
        if (rememberedEmail) {
            emailInput.value = rememberedEmail;
            rememberMeCheckbox.checked = true;
        }

        // Email Validation
        emailInput.addEventListener('blur', () => {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                emailInput.classList.add('error');
                document.getElementById('emailError').classList.add('show');
            } else {
                emailInput.classList.remove('error');
                emailInput.classList.add('success');
                document.getElementById('emailError').classList.remove('show');
            }
        });

        // Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Hide previous alerts
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');

            // Basic validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                emailInput.classList.add('error');
                document.getElementById('emailError').classList.add('show');
                return;
            }

            if (!password) {
                passwordInput.classList.add('error');
                document.getElementById('passwordError').classList.add('show');
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                // Send to n8n webhook for authentication
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'login',
                        email: email,
                        password: password,
                        timestamp: new Date().toISOString()
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Login successful
                    
                    // Store user data in localStorage
                    localStorage.setItem('eagleeye_user', JSON.stringify({
                        email: email,
                        free_tests: data.free_tests || 3,
                        tests_used: data.tests_used || 0,
                        subscription_status: data.subscription_status || 'trial',
                        plan_type: data.plan_type || 'free',
                        logged_in: true
                    }));

                    // Handle "Remember Me"
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('eagleeye_remembered_email', email);
                    } else {
                        localStorage.removeItem('eagleeye_remembered_email');
                    }

                    // Show success message
                    successAlert.classList.add('show');

                    // Redirect to dashboard after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'dashboard-update.html';
                    }, 1500);

                } else {
                    // Login failed
                    throw new Error(data.message || 'Invalid credentials');
                }

            } catch (error) {
                console.error('Error:', error);
                
                // Show error message
                errorAlert.classList.add('show');
                
                // Reset button
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');

                // Highlight inputs as error
                emailInput.classList.add('error');
                passwordInput.classList.add('error');
            }
        });

        // Remove error state on input
        emailInput.addEventListener('input', () => {
            emailInput.classList.remove('error');
            errorAlert.classList.remove('show');
        });

        passwordInput.addEventListener('input', () => {
            passwordInput.classList.remove('error');
            errorAlert.classList.remove('show');
        });
    </script>
</body>
</html>
