<!-- Add this to the TOP of your dashboard.html <script> section -->

<script>
// ==========================================
// SIMPLE FIX: Always fetch fresh data
// ==========================================

const AUTH_WEBHOOK_URL = '/.netlify/functions/auth-proxy';
const TESTING_WEBHOOK_URL = '/.netlify/functions/test-proxy';
let currentUser = null;

// Initialize Dashboard - Fetch fresh data from server
async function initDashboard() {
    const storedUser = localStorage.getItem('eagleeye_user');
    
    if (!storedUser) {
        window.location.href = 'login.html';
        return;
    }

    const user = JSON.parse(storedUser);
    
    // ALWAYS fetch fresh data from server on load
    await refreshUserData(user.email);
    
    updateStats();
    updateUserInfo();
}

// Refresh user data from server
async function refreshUserData(email) {
    try {
        const response = await fetch(AUTH_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'get_user_data',
                email: email
            })
        });

        const data = await response.json();
        
        if (data.success) {
            // Update currentUser with FRESH data from Google Sheets
            currentUser = {
                email: email,
                name: data.name || email.split('@')[0],
                plan_type: data.plan_type || 'free',
                tests_used: parseInt(data.tests_used) || 0,
                tests_limit: parseInt(data.tests_limit) || 3,
                subscription_status: data.subscription_status || 'inactive'
            };
            
            // Update localStorage with fresh data
            localStorage.setItem('eagleeye_user', JSON.stringify(currentUser));
            
            console.log('✅ Fresh data loaded:', currentUser);
        }
    } catch (error) {
        console.error('Error fetching fresh data:', error);
        // Fallback to localStorage
        currentUser = JSON.parse(localStorage.getItem('eagleeye_user'));
    }
}

// Update Stats Display
function updateStats() {
    if (!currentUser) return;
    
    document.getElementById('testsUsed').textContent = currentUser.tests_used || 0;
    document.getElementById('testsLimit').textContent = currentUser.tests_limit || 3;
    document.getElementById('planType').textContent = (currentUser.plan_type || 'free').toUpperCase();
    
    const remaining = (currentUser.tests_limit || 3) - (currentUser.tests_used || 0);
    document.getElementById('testsRemaining').textContent = remaining;
}

// Update User Info
function updateUserInfo() {
    if (!currentUser) return;
    
    document.getElementById('userName').textContent = currentUser.name || currentUser.email.split('@')[0];
    document.getElementById('userEmail').textContent = currentUser.email;
}

// ==========================================
// Test Submission - Always refresh after
// ==========================================

document.getElementById('testForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const websiteUrl = document.getElementById('websiteUrl').value;
    const testNotes = document.getElementById('testNotes').value;
    const scenarios = collectScenarios();
    const testBtn = document.getElementById('testBtn');
    const alertBox = document.getElementById('dashboardAlert');
    
    // Check limits
    const remaining = (currentUser.tests_limit || 3) - (currentUser.tests_used || 0);
    if (remaining <= 0) {
        alert('❌ You\'ve used all your tests! Please upgrade your plan.');
        return;
    }
    
    testBtn.disabled = true;
    testBtn.textContent = '⏳ Starting test...';
    
    try {
        // Submit test to Testing Workflow
        // (Testing Workflow will update Tests_Used in Google Sheets)
        await fetch(TESTING_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: currentUser.email,
                url: websiteUrl,
                package: currentUser.plan_type || 'free',
                subscription: currentUser.subscription_status === 'active',
                test_notes: testNotes,
                custom_scenarios: scenarios
            })
        });
        
        // IMPORTANT: Wait 2 seconds for workflow to update Google Sheets
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // Refresh data from server to get updated Tests_Used
        await refreshUserData(currentUser.email);
        updateStats();
        
        // Success message
        alertBox.className = 'alert alert-success';
        alertBox.textContent = scenarios.length > 0 
            ? `✅ Test started with ${scenarios.length} custom scenario(s)! Results via email.`
            : '✅ Test started! You\'ll receive results via email.';
        alertBox.classList.remove('hidden');
        
        // Clear form
        document.getElementById('websiteUrl').value = '';
        document.getElementById('testNotes').value = '';
        document.getElementById('scenariosContainer').innerHTML = '';
        scenarioCount = 0;
        
        setTimeout(() => {
            alertBox.classList.add('hidden');
        }, 5000);
        
    } catch (error) {
        console.error('Error:', error);
        alertBox.className = 'alert alert-error';
        alertBox.textContent = '❌ Error starting test. Please try again.';
        alertBox.classList.remove('hidden');
    }
    
    testBtn.disabled = false;
    testBtn.textContent = '🚀 Start Test';
});

// ==========================================
// Initialize on page load
// ==========================================

window.addEventListener('DOMContentLoaded', () => {
    initDashboard();
    checkPaymentSuccess();
});

// Refresh data every 30 seconds (optional but helpful)
setInterval(() => {
    if (currentUser && currentUser.email) {
        refreshUserData(currentUser.email).then(() => {
            updateStats();
        });
    }
}, 30000); // 30 seconds

</script>
